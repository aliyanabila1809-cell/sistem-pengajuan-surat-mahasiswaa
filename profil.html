
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profil Mahasiswa - SuratMahasiswa</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="dashboard-page">

    <header class="dashboard-header">
        <a href="dashboard.html" class="dashboard-brand">
            Surat<span>Mahasiswa</span>
        </a>

        <button class="logout-button"
            onclick="window.location.href='dashboard.html'">
            Kembali
        </button>
    </header>

    <main class="dashboard-container">

        <section class="profile-card">
            <h2>Profil Mahasiswa</h2>
            <p>Informasi akun mahasiswa yang terdaftar pada sistem.</p>

            <div class="profil-avatar">👤</div>

            <form id="profilForm" class="pengajuan-form">

                <label for="namaProfil">Nama Lengkap</label>
                <input type="text" id="namaProfil" required>

                <label for="nimProfil">NIM</label>
                <input type="text" id="nimProfil" required>

                <label for="emailProfil">Email</label>
                <input type="email" id="emailProfil" readonly>

                <button type="submit" class="auth-button" id="simpanProfil">
                    Simpan Perubahan
                </button>

            </form>

            <p id="pesanProfil" class="pesan-pengajuan"></p>
        </section>

    </main>

    <script type="module" src="profil.js"></script>
</body>
</html>
